version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: test123
    ports:
      - "9000:9000"

  api:
    image: node:20
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      - postgres
      - minio
    environment:
      DATABASE_URL: postgres://test:test@postgres:5432/testdb
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: test123
    command: >
      sh -c "
        npx chapchapapi init test-api &&
        cd test-api &&
        npm install &&
        npx prisma migrate deploy &&
        npm start
      "
    ports:
      - "3000:3000"
